pipeline:
  name: 历史长音频流水线
  version: 1.0.0
output:
  library_root: /Users/local/Desktop/历史说素材/决战五千年/
  dirs:
    video: 成片
    images: 图片
    audio: 录音
    script: 稿子
    subtitle: 字幕
    shorts: 短视频
  backup_before_overwrite: true
  archive_images: false
tts:
  engine: edge-tts
  voice: zh-CN-YunjianNeural
  rate: -4%
  subtitle_format: vtt
image:
  source: generate
  local_dir: ''
  provider: tongyi
  style_anchor: 中国古风，水墨质感，纪录片氛围，无文字，场景宏大，写意风格
  tongyi:
    api_base: https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis
    model: wanx2.1-t2i-turbo
    size: 1080*1440
    batch_size: 3
    max_retries: 3
    poll_interval: 5
    timeout: 600
  cost_guard:
    max_images_per_episode: 50
    log_file: logs/image_costs.csv
video:
  width: 1080
  height: 1920
  fps: 25
  aspect: '9:16'
  pixel_format: yuv420p
  transition: concat
  ken_burns:
    zoom_start: 1.0
    zoom_end: 1.08
    pan_speed: 0.0004
    preview_scale: 2
  xfade:
    transition: fade
    duration: 1.0
  encoder_platform:
    darwin: h264_videotoolbox
    linux: libx264
  encoder_options:
    libx264:
      crf: 26
      preset: medium
    h264_videotoolbox:
      bitrate: 3000k
  audio_codec: aac
  audio_bitrate: 192k
subtitle:
  font_path: /Library/Fonts/AdobeHeitiStd-Regular.otf
  font_path_linux: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
  font_size: 60
  margin_bottom: 400
  bar_height: 300
  max_chars_per_line: 14
  max_lines: 2
  outline_width: 3
title_card:
  duration: 3
  main_font_size: 69
  series_font_size: 36
  line_gap: 25
  series_gap: 50
  gold_line_gap: 18
  gold_line_width: 400
  gold_line_height: 3
  series_name: 上下五千年
bgm:
  enabled: true
  path: assets/bgm.mp3
  volume: 0.12
  # GL-20260817-04：分段配乐专用音量（比单 BGM 高，无人声时明显可闻）
  seg_volume: 0.18
  # GL-20260817-04：分段配乐库根目录，按情绪分目录：{悬念|平叙|高潮|收束}/*.mp3
  # 库缺失/情绪缺素材 → 自动退回 path 单 BGM 兜底
  library_root: ~/历史说素材/bgm/
checks:
  max_line_length: true
  text_integrity: true
  max_lines: true
review:
  enabled: true
cleanup:
  clean_clips: true
  clean_images: false

# GL-20260817-03：风格预设（制作选项「风格」下拉 → 运行时 deep-merge 进配置）
# story=故事风格（长片·舒缓，不覆盖任何值=固化现状）｜ short=短视频风格（快节奏）
style:
  default: story
  presets:
    story: {}
    short:
      tts:
        rate: "+100%"        # 2 倍速（实测 +200% 会被服务端封顶成 2 倍速，规范值用 +100%）
      bgm:
        volume: 0.20
      video:
        transition: xfade    # 交叉溶解，短视频感
        ken_burns:
          zoom_end: 1.12     # 动效更明显
      subtitle:
        font_size: 66        # 字幕更抓眼
      title_card:
        duration: 2          # 片头更短更冲
