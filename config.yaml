pipeline:
  name: 历史长音频流水线
  version: 1.0.0
output:
  library_root: /Users/local/Desktop/历史说素材/红楼梦/
  dirs:
    video: 成片
    images: 图片
    audio: 录音
    script: 稿子
    subtitle: 字幕
    shorts: 短视频
  backup_before_overwrite: true
  archive_images: false
tts:
  engine: edge
  voice: zh-CN-YunjianNeural
  doubao:
    voice: zh_male_dayi_saturn_bigtts
  rate: -4%
  rate_manual: true
  subtitle_format: vtt
  emotion_rates: {}
ai_script:
  # GL-20260901：AI 稿模仿使用者个人风格（从每次改稿中学习，越写越像）
  style_enabled: true

image:
  source: generate
  local_dir: ''
  provider: tongyi
  style_anchor: 中国古风，水墨质感，纪录片氛围，无文字，场景宏大，写意风格
  tongyi:
    api_base: https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis
    model: wanx2.1-t2i-turbo
    size: 1080*1440
    batch_size: 3
    max_retries: 3
    poll_interval: 5
    timeout: 600
  cost_guard:
    max_images_per_episode: 50
    log_file: logs/image_costs.csv
video:
  width: 1080
  height: 1920
  fps: 25
  aspect: '9:16'
  pixel_format: yuv420p
  transition: concat
  ken_burns:
    zoom_start: 1.0
    zoom_end: 1.08
    pan_speed: 0.0004
    preview_scale: 2
    emotions:
      悬念:
        zoom_end: 1.1
        pan_speed: 0.0003
      平叙:
        zoom_end: 1.08
        pan_speed: 0.0004
      高潮:
        zoom_end: 1.18
        pan_speed: 0.0008
      收束:
        zoom_end: 1.06
        pan_speed: 0.0003
  xfade:
    transition: fade
    duration: 1.0
  encoder_platform:
    darwin: h264_videotoolbox
    linux: libx264
    win32: libx264
  encoder_options:
    libx264:
      crf: 26
      preset: medium
    h264_videotoolbox:
      bitrate: 3000k
  audio_codec: aac
  audio_bitrate: 192k
  mode: image
  crop_vertical:
    enabled: true
    keep: 0.7
subtitle:
  font_path: /Library/Fonts/AdobeHeitiStd-Regular.otf
  font_path_linux: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
  font_size: 60
  margin_bottom: 400
  bar_height: 300
  max_chars_per_line: 14
  max_lines: 2
  outline_width: 3
  font_path_windows: C:/Windows/Fonts/msyh.ttc
title_card:
  duration: 2
  main_font_size: 69
  series_font_size: 36
  line_gap: 25
  series_gap: 50
  gold_line_gap: 18
  gold_line_width: 400
  gold_line_height: 3
  series_name: 上下五千年
bgm:
  enabled: true
  path: assets/bgm.mp3
  volume: 0.12
  seg_volume: 0.25
  library_root: /Users/local/Desktop/历史说素材/bgm/
checks:
  max_line_length: true
  text_integrity: true
  max_lines: true
review:
  enabled: true
cleanup:
  clean_clips: true
  clean_images: false
video_source:
  root: /Users/local/Desktop/视频素材/
dropbox:
  enabled: false
  watch_dir: ~/历史说素材/投递/
  out_dir: ~/历史说素材/成片/
  interval_sec: 5
  series: ''
style:
  default: story
  presets:
    story: {}
    short:
      tts:
        rate: +100%
      bgm:
        volume: 0.2
      video:
        transition: mixed
        ken_burns:
          zoom_end: 1.12
      subtitle:
        font_size: 66
      title_card:
        duration: 2
content_types:
  default: 故事
  presets:
    商品:
      voice: zh-CN-XiaoxiaoNeural
      rate: +5%
      style: short
      keyword_hint: 产品实拍、使用场景、细节特写
    故事:
      voice: zh-CN-YunjianNeural
      rate: -4%
      style: story
      keyword_hint: 纪录片、历史、人物
    营销:
      voice: zh-CN-YunxiNeural
      rate: +50%
      style: short
      keyword_hint: 宣传片、品牌、高冲击画面
canvas:
  default: portrait
  presets:
    portrait:
      width: 1080
      height: 1920
      aspect: '9:16'
      image_size: 1080*1440
    landscape:
      width: 1920
      height: 1080
      aspect: '16:9'
      image_size: 1440*810
      subtitle:
        font_size: 76
        max_chars_per_line: 24
        margin_bottom: 200
        bar_height: 240
